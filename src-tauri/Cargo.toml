[package]
name = "Flashspan"
version = "2.9.0"
description = "Mental Maths training simulator"
authors = ["you"]
repository = ""
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Only the seeded StdRng and the OS seed source are shipped. The default
# `thread_rng` feature pulls in a thread-local state machine that adds ~1.8KB
# to the wasm even though the browser always supplies an explicit seed. Tests
# still need `rand::rng()`, so they re-enable it as a dev-dependency below.
rand = { version = "0.10", default-features = false, features = ["std_rng", "sys_rng"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
log = "0.4"
rodio = "0.23"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
rand = { version = "0.10", features = ["thread_rng"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.4"
rand = { version = "0.10", features = ["thread_rng"] }

# Release tuning applies to both shipped targets: the desktop bundle and the
# wasm32 bundle. `strip` is the dominant size win (both shipped unstripped
# before), LTO plus a single codegen unit add ~10-20% on top, and
# `opt-level = "s"` suits both: the heaviest work is one bounded number
# generation per session, so size beats speed here.
#
# `panic = "abort"` is deliberately not set: measured at zero size saving on
# wasm, and on desktop it would turn a panic in an audio or UI thread into a
# hard abort rather than an unwind. Likewise rejected after measurement:
# `opt-level = "z"` (+2.6KB wasm), extra `wasm-opt` strip passes (+118B), and
# `-C target-cpu=mvp` (+1.9KB). `lto = "thin"` gives the same size for a faster
# build if build time ever matters more than max optimization. The browser
# build alone raises the release opt level to 3 (see `build:wasm`); that produced
# a *smaller* wasm than "s" by giving LLVM more inlining to dead-code-eliminate
# before wasm-bindgen and `wasm-opt -Oz` see it.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

# wasm-pack's bundled `wasm-opt` (binaryen 117) validates with the baseline
# feature set off, but current rustc emits bulk-memory and non-trapping
# float-to-int instructions (Rust's saturating `as` casts lower to
# `trunc_sat`), so every release web build otherwise dies in the validator.
# These flags do not raise the browser baseline: rustc already emits them, they
# only let the optimizer read its own input. `-Oz` also gives up a little more
# size than the default `-O`, which is the right trade for a download.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
	"-Oz",
	"--enable-bulk-memory",
	"--enable-nontrapping-float-to-int",
]
