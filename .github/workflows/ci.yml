name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun runtime
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun
            .bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest
        run: bun run test

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Lint frontend
        run: bun x biome check .

      - name: Type check frontend
        run: bun x tsc --noEmit

      - name: Build frontend
        run: bun run build

  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libasound2-dev \
            libdbus-1-dev \
            libssl-dev \
            curl \
            xz-utils \
            file

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # No separate `cargo check` step: the test and lint runs below already
      # compile the lib, the bin and every test target.
      - name: Run Rust tests
        run: cargo test --locked

      # `cargo test --locked` reports pass/fail, which on a two-target crate says
      # nothing about the wasm side: a plain `#[test]` compiles for wasm32 but is
      # never run there. Coverage turns that into a number.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure Rust coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./src-tauri/lcov.info
          flags: rust
          fail_ci_if_error: false
          continue-on-error: true

      - name: Run Rust lints
        run: cargo clippy --locked --all-targets -- -D warnings -D clippy::pedantic

      # The browser bridge only compiles for wasm32, so the host run above
      # never sees it; without this it rots unnoticed.
      - name: Run Rust lints (wasm32 target)
        run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings -D clippy::pedantic

  wasm:
    name: WASM Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Bun runtime
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun
            .bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build browser bundle with WASM
        run: bun run build:web

      # Runs the whole wasm_bindgen_test suite. Do not "fix" a failure by
      # adding wasm_bindgen_test_configure!(run_in_browser): under --node that
      # makes this step execute zero tests without failing.
      - name: Run WASM tests
        working-directory: src-tauri
        run: wasm-pack test --node

      # A plain `#[test]` compiles under wasm32 but is silently skipped by the
      # wasm-bindgen test runner, so the only symptom of a regression here is a
      # smaller count. Assert the count matches the source instead: this is how
      # the wire-format tests went unrunning on the one target that needs them.
      - name: Guard against silently skipped WASM tests
        working-directory: src-tauri
        run: |
          set -euo pipefail
          # Two decoration forms exist: the literal attribute and the
          # cfg_attr form used by tests that must run on both targets.
          decorated=$(( $(grep -rho '#\[wasm_bindgen_test\]' --include='*.rs' . | wc -l) + $(grep -rho 'cfg_attr(target_arch' --include='*.rs' . | wc -l) ))
          actual=$(wasm-pack test --node 2>&1 \
            | grep -oE 'running [0-9]+ tests' | head -1 | grep -oE '[0-9]+')
          echo "decorated #[wasm_bindgen_test] functions: $decorated"
          echo "tests wasm-pack actually ran: $actual"
          if [ "$actual" != "$decorated" ]; then
            echo "::error::wasm-pack ran $actual tests but $decorated are decorated #[wasm_bindgen_test]. A plain #[test] was silently skipped."
            exit 1
          fi

      # Also run the frontend suite here rather than only in the frontend job:
      # this is the one job where src/wasm/pkg exists, so it is the only place the
      # JS/WASM parity test can actually run instead of skipping.
      - name: Run frontend tests against the built WASM package
        run: bun run test
